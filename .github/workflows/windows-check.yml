name: Windows checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/dsh-social-bridge-plugin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix packages/dsh-social-bridge-plugin --ignore-scripts
      - run: python -m pip install -r scripts/test-requirements.txt clang-format==23.1.5
      - name: Check source, tests and native components
        env:
          WECHATAGENT_QUALITY_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          $env:WECHATAGENT_TEST_PYTHON = (Get-Command python).Source
          $env:CLANG_FORMAT = Join-Path (python -c "import sysconfig; print(sysconfig.get_path('scripts'))") 'clang-format.exe'
          $env:WECHATAGENT_DSH_SDK_ROOT = Join-Path $env:RUNNER_TEMP 'wechatagent-dsh-sdk'
          npm install --prefix $env:WECHATAGENT_DSH_SDK_ROOT --ignore-scripts --no-audit --no-fund --no-save '@deepseek-ai/dsh-tools@0.2.2-rc.5' '@deepseek-ai/dsh-scope@0.2.2-rc.5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
